
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PySimple | Discord</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background-glow"></div>

    <header>
        <nav>
            <div class="brand">🔥 PySimple</div>
            <a class="nav-link" href="#accueil">Accueil</a>
        </nav>
    </header>

    <main id="accueil">
        <div class="hero">

            <div class="logo-container">
                <img src="logo.webp"
                     alt="Logo PySimple"
                     class="logo">
            </div>

            <h1>Py<span>Simple</span></h1>

            <p class="subtitle">
                Bienvenue sur le serveur Discord PySimple
            </p>

            <p class="creator">
                Créé par <strong>ArkOda</strong>
            </p>

            <a
                href="https://discord.gg/6CfsnucHW2"
                target="_blank"
                rel="noopener noreferrer"
                class="discord-button"
            >
                🚀 Rejoindre le Discord
            </a>

            <div class="status">
                <span class="status-dot"></span>
                Communauté Discord
            </div>

        </div>
    </main>

    <footer>
        <p>© 2026 PySimple — Créé par ArkOda</p>
    </footer>

</body>
</html>
